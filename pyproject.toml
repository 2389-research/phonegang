[project]
name = "phonegang"
version = "0.1.0"
description = "Android phone control suite using accessibility trees"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Phonegang Contributors"}
]
keywords = ["android", "adb", "automation", "ui-testing", "accessibility", "mobile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "adb-shell[usb]>=0.4.4",
    "click>=8.3.0",
    "lxml>=6.0.2",
    "mcp>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/phonegang"
Documentation = "https://github.com/yourusername/phonegang#readme"
Repository = "https://github.com/yourusername/phonegang"
Issues = "https://github.com/yourusername/phonegang/issues"

[project.scripts]
phonegang = "phonegang.cli:cli"
phonegang-mcp = "phonegang.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = true
